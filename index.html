<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Перегляд</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;background:#f8fafc;margin:20px;text-align:center;color:#1e293b}
    h1{font-size:1.4rem;margin-bottom:1rem}
    canvas{margin-top:16px;max-width:90vw;border:1px solid #e2e8f0;background:#fff}
  </style>
</head>
<body>
  <h1>Переглядач PDF</h1>
  <p>Автоматично відкривається файл <b>example.pdf</b> із кореня репозиторію.</p>
  <canvas id="pdfCanvas"></canvas>

  <script src="https://unpkg.com/pdfjs-dist@2.16.105/build/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@2.16.105/build/pdf.worker.min.js';

    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');

    async function renderPdf(url){
      const pdfDoc = await pdfjsLib.getDocument(url).promise;
      const page = await pdfDoc.getPage(1);
      const viewport = page.getViewport({scale: 1.2});
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({canvasContext: ctx, viewport}).promise;
    }

    // автоматично підвантажує PDF із кореня репозиторію
    renderPdf('example.pdf').catch(err => {
      document.body.insertAdjacentHTML('beforeend', `<p style="color:red">Помилка: ${err.message}</p>`);
    });
  </script>
</body>
</html>
