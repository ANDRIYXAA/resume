<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Viewer Fullscreen</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:black; }
    canvas { display:block; margin:0 auto; width:100%; height:auto; }
  </style>
</head>
<body>
  <canvas id="pdfCanvas"></canvas>

  <script src="https://unpkg.com/pdfjs-dist@2.16.105/build/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@2.16.105/build/pdf.worker.min.js';

    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');

    async function renderPdf(url){
      const pdfDoc = await pdfjsLib.getDocument(url).promise;
      const page = await pdfDoc.getPage(1);

      // Масштаб для чіткої якості на всю ширину
      const viewport = page.getViewport({ scale: 1 });
      const scale = window.innerWidth / viewport.width;
      const scaledViewport = page.getViewport({ scale });

      canvas.width = scaledViewport.width;
      canvas.height = scaledViewport.height;

      await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;
    }

    // PDF з кореня репозиторію
    renderPdf('example.pdf');

    // Перерендер при зміні розміру вікна для чіткості
    window.addEventListener('resize', ()=>{
      renderPdf('example.pdf');
    });
  </script>
</body>
</html>
